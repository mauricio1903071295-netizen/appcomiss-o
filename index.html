<style>
  :root {
    --paper: #F6F2E7;
    --paper-line: #E4DCC6;
    --ink: #23281F;
    --ink-soft: #5C6152;
    --forest: #1F3A2E;
    --forest-light: #2E5443;
    --gold: #C08A28;
    --gold-bg: #FAF0DA;
    --gold-light: #E7C877;
    --receber: #3F6B4F;
    --receber-bg: #E4EEE3;
    --atraso: #A63A3A;
    --atraso-bg: #F7E6E1;
    --nf: #2E5AA6;
    --nf-bg: #E2EAF6;
    --card: #FFFDF7;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 1040px; margin: 0 auto; padding: 32px 24px 80px; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--forest);
    padding-bottom: 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    color: var(--forest);
    letter-spacing: -0.02em;
  }
  .masthead .sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .masthead .actions { display: flex; gap: 8px; }

  button { font-family: 'IBM Plex Sans', sans-serif; cursor: pointer; }
  .btn {
    border: 1.5px solid var(--forest);
    background: transparent;
    color: var(--forest);
    padding: 9px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .btn:hover { background: var(--forest); color: #fff; }
  .btn-primary { background: var(--forest); color: #fff; }
  .btn-primary:hover { background: var(--forest-light); }
  .btn-ghost { border-color: var(--paper-line); color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--paper-line); color: var(--ink); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  .hero-card {
    background: var(--forest); color: #fff; border-radius: 14px; padding: 20px 22px;
  }
  .hero-card .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-light); font-weight: 500; }
  .hero-card .big { font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 500; margin: 8px 0 2px; }
  .hero-card .caption { font-size: 12px; color: #C7D3C9; }
  .hero-side {
    background: var(--card); border: 1px solid var(--paper-line); border-radius: 14px;
    padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; gap: 6px;
  }
  .hero-side .eyebrow2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 500; margin-bottom: 2px; }
  .hero-side .big2 { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; }
  .hero-side.warn .big2 { color: var(--gold); }
  .hero-side.warn { border-color: var(--gold-light); }
  .hero-side .caption2 { font-size: 12px; color: var(--ink-soft); }

  .strip-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 10px; font-weight: 500; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 32px; }
  .strip::-webkit-scrollbar { height: 6px; }
  .strip::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 4px; }
  .month-card {
    flex: 0 0 auto; min-width: 128px; background: var(--card); border: 1px solid var(--paper-line);
    border-radius: var(--radius); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .month-card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .month-card.active { border-color: var(--forest); border-width: 2px; background: var(--receber-bg); }
  .month-card.current { position: relative; }
  .month-card.current::before {
    content: ''; position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
  }
  .month-card .m-label { font-size: 12px; color: var(--ink-soft); text-transform: capitalize; }
  .month-card .m-val { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; margin-top: 4px; }
  .month-card .m-breakdown { display: flex; gap: 8px; margin-top: 6px; font-size: 10.5px; }
  .month-card .m-breakdown span { display: flex; align-items: center; gap: 3px; color: var(--ink-soft); }
  .dot-sw { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot-sw.confirmado { background: var(--receber); }
  .dot-sw.pendente { background: var(--gold); }
  .dot-sw.atrasado { background: var(--atraso); }

  .panel {
    background: var(--card); border: 1px solid var(--paper-line); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 28px; display: none;

  .panel.open { display: block; }
  .panel h2 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin: 0 0 16px; color: var(--forest); }
  .grid-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .field input, .field select {
    border: 1px solid var(--paper-line); border-radius: 7px; padding: 9px 10px; font-size: 14px;
    font-family: 'IBM Plex Sans', sans-serif; background: #fff; color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(31,58,46,0.12); }
  .preview {

  .preview b { color: var(--forest); font-family: 'IBM Plex Mono', monospace; }
  .panel-actions { display: flex; gap: 10px; margin-top: 18px; }

  .settings-panel { background: var(--card); border: 1px solid var(--paper-line); border-radius: 14px; padding: 20px 22px; margin-bottom: 28px; display: none; }

  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); font-weight: 500; padding: 8px 8px; border-bottom: 2px solid var(--forest); }

  .cliente-cell { font-weight: 500; }
  .plano-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--receber-bg); color: var(--receber); font-weight: 500; white-space: nowrap; }

  .check-circle {

  .check-circle.nf-check.checked { background: var(--nf); border-color: var(--nf); }

  .mes-cell { display: flex; align-items: center; gap: 6px; }

  .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .icon-btn { background: transparent; border: none; color: var(--ink-soft); padding: 4px 6px; border-radius: 6px; font-size: 14px; }
  .icon-btn:hover { background: var(--paper-line); color: var(--ink); }
  .empty { text-align: center; padding: 50px 20px; color: var(--ink-soft); }

  .empty p { font-size: 14px; margin: 10px 0 16px; }

  .loading-state { text-align: center; padding: 80px 20px; color: var(--ink-soft); font-size: 14px; }

  @media (max-width: 480px) {
    .grid-form { grid-template-columns: 1fr; }
    .masthead { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>

let supa = null;
let session = null;
let authBusy = false;
let vendas = [];
let config = { regra: 'mes_seguinte', diasPagamento: 60, whatsappContador: '' };
let panelOpen = false;
let settingsOpen = false;
let editingId = null;
let selectedMonthKey = null;
let searchTerm = '';
let onlyPendentes = false;
let showConcluidos = false;
let showPastMonths = false;
let correctingId = null;

function fmtBRL(v) { return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function parseDate(s) { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
function monthKeyFromDate(date) { return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0'); }
function monthKeyAdd(key, n) {
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return monthKeyFromDate(d);
}
function monthLabel(key) { const [y,m] = key.split('-').map(Number); return MESES_LONGOS[m-1] + ' de ' + y; }
function monthShort(key) { const [y,m] = key.split('-').map(Number); return MESES[m-1] + '/' + String(y).slice(2); }

function calcComissao(valor) { return Math.round(valor * (PERCENTUAL_COMISSAO/100) * 100) / 100; }
function calcMesPrevisto(venda) {
  const venc = parseDate(venda.primeiroVencimento);
  if (!venc) return null;
  if (config.regra === 'mes_seguinte') {
    return monthKeyFromDate(new Date(venc.getFullYear(), venc.getMonth()+1, 1));
  }
  return monthKeyFromDate(addDays(venc, config.diasPagamento));
}
function mesEfetivo(venda) {
  return venda.mesCorrigido || calcMesPrevisto(venda);
}

function toRow(v) {
  return {
    data_venda: v.dataVenda,
    cliente: v.cliente,
    plano: v.plano,
    valor: v.valor,
    primeiro_vencimento: v.primeiroVencimento,
    comissao: v.comissao,
    confirmado: v.confirmado,
    nf_solicitada: v.nfSolicitada,
    mes_corrigido: v.mesCorrigido
  };
}
function fromRow(r) {
  return {
    id: r.id,
    dataVenda: r.data_venda,
    cliente: r.cliente,
    plano: r.plano,
    valor: Number(r.valor),
    primeiroVencimento: r.primeiro_vencimento,
    comissao: Number(r.comissao),
    confirmado: r.confirmado,
    nfSolicitada: r.nf_solicitada,
    mesCorrigido: r.mes_corrigido
  };
}

async function loadVendas() {
  const { data, error } = await supa.from('vendas').select('*').order('data_venda');
  if (error) { console.error(error); vendas = []; return; }
  if (data.length === 0) {
    const rows = SEED_VENDAS.map(toRow);
    const { data: inserted, error: insErr } = await supa.from('vendas').insert(rows).select();
    if (insErr) { console.error(insErr); vendas = []; return; }
    vendas = inserted.map(fromRow);
  } else {
    vendas = data.map(fromRow);
  }
}
async function loadConfig() {
  const { data } = await supa.from('configuracoes').select('*').maybeSingle();
  if (data) config = { regra: data.regra, diasPagamento: data.dias_pagamento, whatsappContador: data.whatsapp_contador || '' };
}
async function saveConfig() {
  await supa.from('configuracoes').upsert({ user_id: session.user.id, regra: config.regra, dias_pagamento: config.diasPagamento, whatsapp_contador: config.whatsappContador });
}

function renderLoading() {
  document.getElementById('app').innerHTML = '<div class="loading-state">Carregando…</div>';
}
function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-card">
      <h1>Livro de comissões</h1>
      <div class="auth-sub">Entre com seu e-mail e senha</div>
      <div class="field"><label>E-mail</label><input type="email" id="auth-email"></div>
      <div class="field"><label>Senha</label><input type="password" id="auth-password"></div>
      <div class="auth-error" id="auth-error"></div>
      <div class="auth-actions">
        <button class="btn btn-primary" id="btn-login">Entrar</button>
        <button class="btn btn-ghost" id="btn-signup">Criar conta</button>
      </div>
    </div>
  `;
  document.getElementById('btn-login').addEventListener('click', handleLogin);
  document.getElementById('btn-signup').addEventListener('click', handleSignup);
}
async function handleLogin() {
  if (authBusy) return; authBusy = true;
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const { error } = await supa.auth.signInWithPassword({ email, password });
  authBusy = false;
  if (error) document.getElementById('auth-error').textContent = error.message;
}
async function handleSignup() {
  if (authBusy) return; authBusy = true;
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const { error } = await supa.auth.signUp({ email, password });
  authBusy = false;
  const box = document.getElementById('auth-error');
  if (error) box.textContent = error.message;
  else { box.style.color = 'var(--receber)'; box.textContent = 'Conta criada! Se pedir confirmação, verifique seu e-mail e depois clique em Entrar.'; }
}
async function handleLogout() {
  await supa.auth.signOut();
}

async function boot(newSession) {
  session = newSession;
  if (!session) { vendas = []; renderLogin(); return; }
  renderLoading();
  await loadVendas();
  await loadConfig();
  render();
}
function initSupabase() {
  if (!window.supabase) {
    document.getElementById('app').innerHTML = '<div class="loading-state">Não foi possível carregar a biblioteca de conexão com o banco. Verifique sua internet e recarregue a página.</div>';
    return;
  }
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  supa.auth.onAuthStateChange((_event, s) => { boot(s); });
}

function openPanel(venda) {
  panelOpen = true; editingId = venda ? venda.id : null; render();
  setTimeout(() => { if (venda) fillForm(venda); document.getElementById('f-cliente')?.focus(); }, 0);
}
function closePanel() { panelOpen = false; editingId = null; render(); }
function fillForm(v) {
  document.getElementById('f-data').value = v.dataVenda || '';
  document.getElementById('f-cliente').value = v.cliente || '';
  document.getElementById('f-plano').value = v.plano || 'Full';
  document.getElementById('f-valor').value = v.valor || '';
  document.getElementById('f-vencimento').value = v.primeiroVencimento || '';
  updatePreview();
}
function readForm() {
  return {
    dataVenda: document.getElementById('f-data').value,
    cliente: document.getElementById('f-cliente').value.trim(),
    plano: document.getElementById('f-plano').value,
    valor: parseFloat(document.getElementById('f-valor').value) || 0,
    primeiroVencimento: document.getElementById('f-vencimento').value
  };
}
function updatePreview() {
  const f = readForm();
  const prev = document.getElementById('preview-box');
  if (!prev) return;
  if (!f.valor || !f.primeiroVencimento) { prev.innerHTML = '<span>Preencha o valor do contrato e o vencimento para ver a prévia</span>'; return; }
  const comissao = calcComissao(f.valor);
  const mesPrev = calcMesPrevisto(f);
  prev.innerHTML = '<span>Comissão (80%): <b>' + fmtBRL(comissao) + '</b></span>' +
    '<span>Recebimento previsto: <b>' + (mesPrev ? monthLabel(mesPrev) : '—') + '</b></span>';
}
async function submitForm() {
  const f = readForm();
  if (!f.cliente || !f.valor || !f.primeiroVencimento || !f.dataVenda) { alert('Preencha data da venda, cliente, valor do contrato e primeiro vencimento.'); return; }
  const comissao = calcComissao(f.valor);
  if (editingId) {
    const idx = vendas.findIndex(v => v.id === editingId);
    const atual = vendas[idx];
    const row = toRow({ ...f, comissao, confirmado: atual.confirmado, nfSolicitada: atual.nfSolicitada, mesCorrigido: atual.mesCorrigido });
    const { data, error } = await supa.from('vendas').update(row).eq('id', editingId).select().maybeSingle();
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    if (idx >= 0) vendas[idx] = fromRow(data);
  } else {
    const row = toRow({ ...f, comissao, confirmado: false, nfSolicitada: false, mesCorrigido: null });
    const { data, error } = await supa.from('vendas').insert(row).select().maybeSingle();
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    vendas.push(fromRow(data));
  }
  closePanel();
}
async function deleteVenda(id) {
  if (!confirm('Remover esta venda do livro de comissões?')) return;
  const { error } = await supa.from('vendas').delete().eq('id', id);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  vendas = vendas.filter(v => v.id !== id); render();
}
function toggleSettings() { settingsOpen = !settingsOpen; render(); }

async function toggleConfirmado(id) {
  const v = vendas.find(x => x.id === id); if (!v) return;
  const confirmado = !v.confirmado;
  const nfSolicitada = confirmado ? v.nfSolicitada : false;
  const { error } = await supa.from('vendas').update({ confirmado, nf_solicitada: nfSolicitada }).eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  v.confirmado = confirmado; v.nfSolicitada = nfSolicitada; render();
}
async function toggleNf(id) {
  const v = vendas.find(x => x.id === id); if (!v || !v.confirmado) return;
  const nfSolicitada = !v.nfSolicitada;
  const { error } = await supa.from('vendas').update({ nf_solicitada: nfSolicitada }).eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  v.nfSolicitada = nfSolicitada; render();
}
function startCorrect(id) { correctingId = id; render(); }
function cancelCorrect() { correctingId = null; render(); }
async function applyCorrect(id) {
  const input = document.getElementById('mes-input-' + id);
  const v = vendas.find(x => x.id === id); if (!v || !input) return;
  const mesCorrigido = input.value;
  const { error } = await supa.from('vendas').update({ mes_corrigido: mesCorrigido, confirmado: false, nf_solicitada: false }).eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  v.mesCorrigido = mesCorrigido; v.confirmado = false; v.nfSolicitada = false;
  correctingId = null; render();
}
async function pushNextMonth(id) {
  const v = vendas.find(x => x.id === id); if (!v) return;
  const mesCorrigido = monthKeyAdd(mesEfetivo(v), 1);
  const { error } = await supa.from('vendas').update({ mes_corrigido: mesCorrigido, confirmado: false, nf_solicitada: false }).eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  v.mesCorrigido = mesCorrigido; v.confirmado = false; v.nfSolicitada = false;
  render();
}
async function resetCorrecao(id) {
  const v = vendas.find(x => x.id === id); if (!v) return;
  const { error } = await supa.from('vendas').update({ mes_corrigido: null }).eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  v.mesCorrigido = null; render();
}

async function fecharMes(mesKey) {
  const itens = getEnriched().filter(v => v.mesKey === mesKey && v.status === 'confirmado');
  if (!itens.length) { alert('Não há comissões confirmadas aguardando nota fiscal neste mês.'); return; }
  const total = itens.reduce((s,v) => s + v.comissao, 0);
  const ok = confirm(`Fechar ${monthLabel(mesKey)}: ${itens.length} venda(s), total ${fmtBRL(total)}.\n\nIsso vai abrir o WhatsApp com o valor pro seu contador e marcar essas vendas como "NF pedida". Continuar?`);
  if (!ok) return;
  const texto = `Olá! Preciso de nota fiscal referente às comissões de ${monthLabel(mesKey)}, no valor total de ${fmtBRL(total)} (${itens.length} venda${itens.length===1?'':'s'}).`;
  const numero = (config.whatsappContador || '').replace(/\D/g, '');
  const url = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
  const ids = itens.map(v => v.id);
  const { error } = await supa.from('vendas').update({ nf_solicitada: true }).in('id', ids);
  if (error) { alert('Abri o WhatsApp, mas houve um erro ao marcar as vendas como faturadas: ' + error.message); return; }
  ids.forEach(id => { const v = vendas.find(x => x.id === id); if (v) v.nfSolicitada = true; });
  render();
}

function getEnriched() {
  const now = new Date(); const curKey = monthKeyFromDate(now);
  return vendas.map(v => {
    const efetivo = mesEfetivo(v);
    let status = 'previsto';
    if (v.confirmado) status = v.nfSolicitada ? 'nf' : 'confirmado';
    else if (efetivo < curKey) status = 'atrasado';
    return { ...v, comissao: v.comissao ?? calcComissao(v.valor), mesKey: efetivo, mesPrevisto: calcMesPrevisto(v), status };
  });
}

function render() {
  const app = document.getElementById('app');
  const enriched = getEnriched();
  const now = new Date(); const curKey = monthKeyFromDate(now);

  const doMesAtual = enriched.filter(v => v.mesKey === curKey);
  const totalMesAtual = doMesAtual.reduce((s,v) => s + v.comissao, 0);
  const pendentesMesAtual = doMesAtual.filter(v => v.status === 'previsto' || v.status === 'atrasado');
  const totalPendenteMesAtual = pendentesMesAtual.reduce((s,v) => s + v.comissao, 0);
  const atrasados = enriched.filter(v => v.status === 'atrasado');
  const totalAtrasado = atrasados.reduce((s,v) => s + v.comissao, 0);
  const qtdVendas = vendas.length;

  const keys = [...new Set(enriched.map(v => v.mesKey).filter(Boolean))];
  if (!keys.includes(curKey)) keys.push(curKey);
  keys.sort();
  const pastKeys = keys.filter(k => k < curKey);
  const visibleKeys = showPastMonths ? keys : keys.filter(k => k >= curKey);
  const monthStats = {};
  keys.forEach(k => {
    const items = enriched.filter(v => v.mesKey === k);
    monthStats[k] = {
      total: items.reduce((s,v)=>s+v.comissao,0),
      confirmado: items.filter(v=>v.confirmado).reduce((s,v)=>s+v.comissao,0),
      pendente: items.filter(v=>!v.confirmado && v.status!=='atrasado').reduce((s,v)=>s+v.comissao,0),
      atrasado: items.filter(v=>v.status==='atrasado').reduce((s,v)=>s+v.comissao,0),
      count: items.length
    };
  });

  const itensFecharMes = selectedMonthKey ? enriched.filter(v => v.mesKey === selectedMonthKey && v.status === 'confirmado') : [];
  const totalFecharMes = itensFecharMes.reduce((s,v) => s + v.comissao, 0);

  let filtered = enriched;
  if (!showConcluidos) filtered = filtered.filter(v => v.status !== 'nf');
  if (selectedMonthKey) filtered = filtered.filter(v => v.mesKey === selectedMonthKey);
  if (onlyPendentes) filtered = filtered.filter(v => v.status === 'previsto' || v.status === 'atrasado');
  if (searchTerm) { const t = searchTerm.toLowerCase(); filtered = filtered.filter(v => v.cliente.toLowerCase().includes(t) || v.plano.toLowerCase().includes(t)); }
  filtered = filtered.slice().sort((a,b) => (a.mesKey||'').localeCompare(b.mesKey||'') || a.cliente.localeCompare(b.cliente));

  app.innerHTML = `
    <div class="masthead">
      <div>
        <h1>Livro de comissões</h1>
        <div class="sub">${qtdVendas} venda${qtdVendas===1?'':'s'} registrada${qtdVendas===1?'':'s'} · comissão fixa de ${PERCENTUAL_COMISSAO}% do valor do contrato</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" id="btn-logout" title="Sair"><i class="ti ti-logout"></i></button>
        <button class="btn btn-ghost btn-sm" id="btn-settings"><i class="ti ti-settings"></i></button>
        <button class="btn btn-primary" id="btn-nova"><i class="ti ti-plus" style="vertical-align:-2px;margin-right:4px"></i>Nova venda</button>
      </div>
    </div>

    <div class="settings-panel ${settingsOpen ? 'open' : ''}">
      <h2>Regra de recebimento</h2>
      <div class="field" style="margin-bottom:14px">
        <label>Quando cai o recebimento da comissão (usado para prever o mês de novas vendas)</label>
        <div class="radio-row">
          <label><input type="radio" name="cfg-regra" value="mes_seguinte" ${config.regra==='mes_seguinte'?'checked':''}> Mês seguinte ao vencimento</label>
          <label><input type="radio" name="cfg-regra" value="dias" ${config.regra==='dias'?'checked':''}> Nº de dias após o vencimento</label>
        </div>
      </div>
      <div class="settings-grid">
        <div class="field">
          <label>Dias até o pagamento (se regra por dias)</label>
          <input type="number" id="cfg-dias" value="${config.diasPagamento}">
        </div>
        <div class="field">
          <label>WhatsApp do contador (com DDI e DDD, só números)</label>
          <input type="text" id="cfg-whatsapp" placeholder="Ex: 5541999998888" value="${config.whatsappContador || ''}">
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary btn-sm" id="btn-save-settings">Salvar regra</button>
      </div>
    </div>

    <div class="hero">
      <div class="hero-card">
        <div class="eyebrow">Total em ${monthLabel(curKey)}</div>
        <div class="big">${fmtBRL(totalMesAtual)}</div>
        <div class="caption">${doMesAtual.length} comissão(ões) prevista(s) para este mês</div>
      </div>
      <div class="hero-side ${pendentesMesAtual.length ? 'warn' : ''}">
        <div class="eyebrow2">Pendente de confirmação</div>
        <div class="big2">${fmtBRL(totalPendenteMesAtual)}</div>
        <div class="caption2">${pendentesMesAtual.length} item(ns) aguardando seu OK</div>
      </div>
      <div class="hero-side ${atrasados.length ? 'warn' : ''}" style="${atrasados.length ? 'border-color:var(--atraso)' : ''}">
        <div class="eyebrow2" style="${atrasados.length ? 'color:var(--atraso)' : ''}">Atrasados (mês já passou)</div>
        <div class="big2" style="${atrasados.length ? 'color:var(--atraso)' : ''}">${fmtBRL(totalAtrasado)}</div>
        <div class="caption2">${atrasados.length} venda(s) para corrigir o mês</div>
      </div>
    </div>

    ${keys.length ? `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="strip-label" style="margin-bottom:0">Calendário de recebimento</div>
      ${pastKeys.length ? `<button class="btn btn-ghost btn-sm" id="btn-toggle-past">${showPastMonths ? 'Ocultar' : 'Ver'} meses anteriores (${pastKeys.length})</button>` : ''}
    </div>
    <div class="strip">
      ${visibleKeys.map(k => `
        <div class="month-card ${selectedMonthKey===k?'active':''} ${k===curKey?'current':''}" data-month="${k}">
          <div class="m-label">${monthShort(k)}</div>
          <div class="m-val">${fmtBRL(monthStats[k].total)}</div>
          <div class="m-breakdown">
            ${monthStats[k].confirmado ? `<span><i class="dot-sw confirmado"></i>${fmtBRL(monthStats[k].confirmado)}</span>` : ''}
            ${monthStats[k].atrasado ? `<span><i class="dot-sw atrasado"></i>${fmtBRL(monthStats[k].atrasado)}</span>` : ''}
          </div>
        </div>
      `).join('')}
    </div>` : ''}

    <div class="panel ${panelOpen ? 'open' : ''}">
      <h2>${editingId ? 'Editar venda' : 'Registrar nova venda'}</h2>
      <div class="grid-form">
        <div class="field"><label>Data da venda</label><input type="date" id="f-data"></div>
        <div class="field"><label>Cliente</label><input type="text" id="f-cliente" placeholder="Nome do cliente"></div>
        <div class="field"><label>Plano</label><select id="f-plano">${PLANOS.map(p => `<option value="${p}">${p}</option>`).join('')}</select></div>
        <div class="field"><label>Valor do contrato (R$)</label><input type="number" step="0.01" id="f-valor" placeholder="0,00"></div>
        <div class="field"><label>Primeiro vencimento</label><input type="date" id="f-vencimento"></div>
      </div>
      <div class="preview" id="preview-box"><span>Preencha o valor do contrato e o vencimento para ver a prévia</span></div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="btn-salvar">${editingId ? 'Salvar alterações' : 'Registrar venda'}</button>
        <button class="btn btn-ghost" id="btn-cancelar">Cancelar</button>
      </div>
    </div>

    <div class="ledger-head">
      <h2>${selectedMonthKey ? monthLabel(selectedMonthKey) : 'Checklist de comissões'}</h2>
      <div class="head-actions">
        ${itensFecharMes.length ? `<button class="btn btn-primary btn-sm" id="btn-fechar-mes"><i class="ti ti-brand-whatsapp" style="vertical-align:-2px;margin-right:4px"></i>Fechar mês (${fmtBRL(totalFecharMes)})</button>` : ''}
        ${selectedMonthKey ? `<button class="btn btn-ghost btn-sm" id="btn-clear-filter">Limpar filtro</button>` : ''}
        <button class="toggle-pill ${onlyPendentes ? 'active' : ''}" id="btn-only-pendentes">Só pendentes</button>
        <button class="toggle-pill ${showConcluidos ? 'active' : ''}" id="btn-show-concluidos">Mostrar já faturados</button>
        <div class="search-box"><input type="text" id="search-input" placeholder="Buscar cliente ou plano" value="${searchTerm}"></div>
      </div>
    </div>

    ${filtered.length ? `
    <table>
      <thead>
        <tr>
          <th class="center">OK</th>
          <th class="center">NF</th>
          <th>Cliente</th>
          <th>Plano</th>
          <th class="num">Valor</th>
          <th class="num">Comissão</th>
          <th>Mês</th>
          <th>Situação</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map(v => `
          <tr class="${v.confirmado ? 'is-confirmado' : ''} ${v.status==='atrasado' ? 'is-atrasado' : ''}">
            <td class="center"><span class="check-circle ${v.confirmado?'checked':''}" data-confirm="${v.id}" title="Confirmar recebimento">${v.confirmado?'<i class="ti ti-check"></i>':''}</span></td>
            <td class="center"><span class="check-circle nf-check ${v.nfSolicitada?'checked':''} ${!v.confirmado?'disabled':''}" data-nf="${v.id}" title="NF solicitada ao contador">${v.nfSolicitada?'<i class="ti ti-check"></i>':''}</span></td>
            <td class="cliente-cell">${v.cliente}</td>
            <td><span class="plano-tag">${v.plano}</span></td>
            <td class="num">${fmtBRL(v.valor)}</td>
            <td class="num">${fmtBRL(v.comissao)}</td>
            <td>
              ${correctingId === v.id ? `
                <div class="mes-editor">
                  <input type="month" id="mes-input-${v.id}" value="${v.mesKey}">
                  <button class="icon-btn" data-apply-correct="${v.id}" title="Salvar"><i class="ti ti-check"></i></button>
                  <button class="icon-btn" data-cancel-correct title="Cancelar"><i class="ti ti-x"></i></button>
                </div>
              ` : `
                <div class="mes-cell">
                  <span>${monthShort(v.mesKey)}${v.mesCorrigido ? ' <i class="ti ti-corner-down-right" style="font-size:11px;color:var(--gold)" title="mês corrigido"></i>' : ''}</span>
                  <button class="mes-edit-btn" data-correct="${v.id}" title="Corrigir mês"><i class="ti ti-pencil"></i></button>
                  <button class="mes-edit-btn" data-push="${v.id}" title="Empurrar p/ próximo mês"><i class="ti ti-arrow-right"></i></button>
                  ${v.mesCorrigido ? `<button class="mes-edit-btn" data-reset="${v.id}" title="Voltar ao mês previsto"><i class="ti ti-restore"></i></button>` : ''}
                </div>
              `}
            </td>
            <td><span class="status-badge ${v.status}">${
              v.status==='previsto' ? 'Previsto' : v.status==='confirmado' ? 'Confirmado' : v.status==='nf' ? 'NF pedida' : 'Atrasado'
            }</span></td>
            <td>
              <div class="row-actions">
                <button class="icon-btn" data-edit="${v.id}" aria-label="Editar"><i class="ti ti-edit"></i></button>
                <button class="icon-btn" data-del="${v.id}" aria-label="Excluir"><i class="ti ti-trash"></i></button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    ` : `
    <div class="empty">
      <i class="ti ti-receipt-2"></i>
      <p>${searchTerm || selectedMonthKey || onlyPendentes ? 'Nenhuma venda encontrada com esse filtro.' : 'Nenhuma venda registrada ainda. Comece adicionando a primeira.'}</p>
      ${!searchTerm && !selectedMonthKey && !onlyPendentes ? '<button class="btn btn-primary btn-sm" id="btn-nova-empty">Registrar venda</button>' : ''}
    </div>
    `}
  `;

  document.getElementById('btn-logout')?.addEventListener('click', handleLogout);
  document.getElementById('btn-nova')?.addEventListener('click', () => openPanel(null));
  document.getElementById('btn-nova-empty')?.addEventListener('click', () => openPanel(null));
  document.getElementById('btn-cancelar')?.addEventListener('click', closePanel);
  document.getElementById('btn-salvar')?.addEventListener('click', submitForm);
  document.getElementById('btn-settings')?.addEventListener('click', toggleSettings);
  ['f-valor','f-vencimento','f-plano'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', updatePreview);
    document.getElementById(id)?.addEventListener('change', updatePreview);
  });
  document.getElementById('btn-clear-filter')?.addEventListener('click', () => { selectedMonthKey = null; render(); });
  document.getElementById('btn-only-pendentes')?.addEventListener('click', () => { onlyPendentes = !onlyPendentes; render(); });
  document.getElementById('btn-show-concluidos')?.addEventListener('click', () => { showConcluidos = !showConcluidos; render(); });
  document.getElementById('btn-toggle-past')?.addEventListener('click', () => { showPastMonths = !showPastMonths; render(); });
  document.getElementById('btn-fechar-mes')?.addEventListener('click', () => { if (selectedMonthKey) fecharMes(selectedMonthKey); });
  document.getElementById('search-input')?.addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
  document.querySelectorAll('.month-card').forEach(el => {
    el.addEventListener('click', () => { const k = el.getAttribute('data-month'); selectedMonthKey = selectedMonthKey === k ? null : k; render(); });
  });
  document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => { const v = vendas.find(x => x.id === el.getAttribute('data-edit')); if (v) openPanel(v); }));
  document.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => deleteVenda(el.getAttribute('data-del'))));
  document.querySelectorAll('[data-confirm]').forEach(el => el.addEventListener('click', () => toggleConfirmado(el.getAttribute('data-confirm'))));
  document.querySelectorAll('[data-nf]').forEach(el => el.addEventListener('click', () => toggleNf(el.getAttribute('data-nf'))));
  document.querySelectorAll('[data-correct]').forEach(el => el.addEventListener('click', () => startCorrect(el.getAttribute('data-correct'))));
  document.querySelectorAll('[data-push]').forEach(el => el.addEventListener('click', () => pushNextMonth(el.getAttribute('data-push'))));
  document.querySelectorAll('[data-reset]').forEach(el => el.addEventListener('click', () => resetCorrecao(el.getAttribute('data-reset'))));
  document.querySelectorAll('[data-apply-correct]').forEach(el => el.addEventListener('click', () => applyCorrect(el.getAttribute('data-apply-correct'))));
  document.querySelectorAll('[data-cancel-correct]').forEach(el => el.addEventListener('click', cancelCorrect));
  document.getElementById('btn-save-settings')?.addEventListener('click', () => {
    const regra = document.querySelector('input[name="cfg-regra"]:checked')?.value || 'mes_seguinte';
    const dias = parseInt(document.getElementById('cfg-dias').value) || 60;
    const whatsappContador = document.getElementById('cfg-whatsapp').value.trim();
    config = { regra, diasPagamento: dias, whatsappContador };
    saveConfig(); settingsOpen = false; render();
  });

  if (panelOpen && editingId) { const v = vendas.find(x => x.id === editingId); if (v) fillForm(v); }
}

initSupabase();
</script>
</body>
</html>
